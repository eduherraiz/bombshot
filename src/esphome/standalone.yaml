    file: sounds/n8.flac
  - id: snd_n9
    file: sounds/n9.flac
  - id: snd_n11
    file: sounds/n11.flac
  - id: snd_n12
    file: sounds/n12.flac
  - id: snd_n13
    file: sounds/n13.flac
  - id: snd_n15
    file: sounds/n15.flac
  - id: snd_n17
    file: sounds/n17.flac
